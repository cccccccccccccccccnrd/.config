# Keep terminal window title in sync with the current tmux window name
set -g set-titles on
set -g set-titles-string '#W'

# Use truecolor inside tmux; Ghostty supplies the font and base palette.
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',xterm-ghostty:Tc'

# Active tmux theme.
source-file ~/.config/tmux/themes/max.conf
