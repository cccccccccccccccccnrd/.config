# tmux theme: max — maximum contrast full RGB + CMYK.
set -g status-style 'bg=#000000,fg=#ffffff'
set -g status-left-style 'bg=#0000ff,fg=#ffffff,bold'
set -g status-right-style 'bg=#000000,fg=#00ffff,bold'
set -g window-status-current-style 'bg=#ffff00,fg=#000000,bold'
set -g window-status-style 'bg=#000000,fg=#ffffff'
set -g window-status-bell-style 'bg=#ff0000,fg=#ffffff,bold'
set -g pane-border-style 'fg=#808080'
set -g pane-active-border-style 'fg=#00ffff'
set -g message-style 'bg=#ff00ff,fg=#ffffff,bold'
